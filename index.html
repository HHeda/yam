<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- `viewport-fit=cover` pour passer sous l'encoche ; les marges de securite
     sont reprises en CSS avec `env(safe-area-inset-*)`. Le zoom reste autorise
     (pas de `user-scalable=no`) : c'est une question d'accessibilite, et
     `touch-action: manipulation` suffit a supprimer le zoom au double-tap sur
     les commandes, qui etait la seule vraie gene. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e6b4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14261d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yam">
<title>Yam</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="icon" href="./icone-192.png">
<link rel="stylesheet" href="./jeu.css">
</head>
<body>

<!-- ===================================================================== -->
<!--  L'ecran d'accueil. Il sert aussi a chauffer le compilateur : le       -->
<!--  moteur tourne a vide pendant que le joueur choisit son mode, ce qui   -->
<!--  evite de payer les ~35 ms de la premiere decision au premier tour.    -->
<!-- ===================================================================== -->
<section id="accueil" class="ecran">
  <h1>Yam</h1>
  <p class="sous-titre">Variante familiale — 12 lignes, 4 colonnes, 48 tours.</p>

  <div class="modes">
    <button class="mode" data-mode="seul">
      <span class="mode-titre">Seul</span>
      <span class="mode-detail">Votre feuille, votre score.</span>
    </button>
    <button class="mode" data-mode="ia">
      <span class="mode-titre">Contre l'IA</span>
      <span class="mode-detail">Chacun sa feuille, chacun son tour.</span>
    </button>
    <button class="mode" data-mode="duo">
      <span class="mode-titre">À deux</span>
      <span class="mode-detail">Sur ce téléphone, en se le passant.</span>
    </button>
  </div>

  <p id="etat-chargement" class="attente">chargement du moteur…</p>
</section>

<!-- ===================================================================== -->
<!--  L'ecran de jeu                                                       -->
<!-- ===================================================================== -->
<section id="jeu" class="ecran cache">

  <header id="entete">
    <button id="bouton-menu" class="icone" aria-label="Menu">≡</button>
    <div id="onglets" role="tablist"></div>
    <button id="bouton-conseil" class="icone" aria-label="Conseil de l'IA">?</button>
  </header>

  <main id="feuille-zone">
    <div id="grille" class="grille"></div>
  </main>

  <footer id="commandes">
    <p id="message">—</p>
    <div id="des" class="des"></div>
    <div id="boutons" class="boutons"></div>
  </footer>

</section>

<!-- Panneau de conseil, remonte du bas -->
<div id="voile" class="cache"></div>
<aside id="panneau" class="cache" role="dialog" aria-modal="true" aria-labelledby="panneau-titre">
  <h2 id="panneau-titre">Conseil</h2>
  <div id="panneau-corps"></div>
  <div id="panneau-boutons"></div>
</aside>

<script type="module" src="./jeu.js"></script>
</body>
</html>
